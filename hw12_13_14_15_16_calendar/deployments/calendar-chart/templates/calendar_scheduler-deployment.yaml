apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calendar_scheduler.fullname" . }}
  labels:
    app: {{ include "calendar_scheduler.name" . }}
spec:
  replicas: {{ .Values.calendar_scheduler.replicas }}
  selector:
    matchLabels:
      app: {{ include "calendar_scheduler.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "calendar_scheduler.name" . }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do sleep 2; done
        - name: wait-for-rabbitmq
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do sleep 2; done
      containers:
        - image: {{ .Values.calendar_scheduler.image }}
          name: {{ include "calendar_scheduler.name" . }}
          args: ["-config", "/opt/calendar_scheduler/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /opt/calendar_scheduler/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "calendar_scheduler.fullname" . }}-config
